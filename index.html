const CACHE_KEY = 'tollroute_station_coords';
const CACHE_TTL_DAYS = 30;

let tollData = null;
let stationCoords = {}; // name -> [lon, lat]
let currentRoutes = {};
let map, routeLayers = [];
let isGeocodingStations = false;

// ============================================================
// Utilidades
// ============================================================

function haversine(lon1, lat1, lon2, lat2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function loadCachedCoords() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return;
    const cached = JSON.parse(raw);
    const now = Date.now();
    for (const [name, entry] of Object.entries(cached)) {
      if (now - entry.ts < CACHE_TTL_DAYS * 86400000) {
        stationCoords[name] = entry.coord;
      }
    }
  } catch(e) {}
}

function saveCachedCoords() {
  try {
    const payload = {};
    for (const [name, coord] of Object.entries(stationCoords)) {
      payload[name] = { coord, ts: Date.now() };
    }
    localStorage.setItem(CACHE_KEY, JSON.stringify(payload));
  } catch(e) {}
}

// ============================================================
// Carga de datos de peajes
// ============================================================

async function loadTollData() {
  try {
    const r = await fetch('spain_tolls.json');
    tollData = await r.json();
    console.log('Cargados', tollData.metadata?.total_segments || '?', 'segmentos de peaje');

    // Cargar coordenadas cacheadas
    loadCachedCoords();

    // Precargar coordenadas conocidas
    for (const [name, coord] of Object.entries(PRELOADED_STATION_COORDS)) {
      if (!stationCoords[name]) stationCoords[name] = coord;
    }

    // Geocodificar estaciones faltantes en background
    geocodeMissingStations();

  } catch(e) {
    console.warn('Error cargando peajes:', e);
    tollData = { networks: [], metadata: {} };
  }
}

async function geocodeMissingStations() {
  if (isGeocodingStations || !tollData?.networks) return;
  isGeocodingStations = true;

  const missing = new Set();
  for (const net of tollData.networks) {
    for (const s of net.stations || []) {
      const name = s.name;
      if (name && !stationCoords[name]) missing.add(name);
    }
  }

  const missingArr = Array.from(missing);
  console.log('Geocodificando', missingArr.length, 'estaciones...');

  for (let i = 0; i < missingArr.length; i++) {
    const name = missingArr[i];
    try {
      const coord = await geocodeStation(name);
      if (coord) {
        stationCoords[name] = coord;
        saveCachedCoords();
      }
    } catch(e) {}
    // Rate limit: esperar 600ms entre peticiones
    if (i < missingArr.length - 1) await new Promise(r => setTimeout(r, 600));
  }

  isGeocodingStations = false;
  console.log('Geocodificación completada');
}

async function geocodeStation(name) {
  const q = encodeURIComponent(name + ', España');
  const url = `https://nominatim.openstreetmap.org/search?format=json&q=${q}&limit=1`;
  const r = await fetch(url);
  const d = await r.json();
  if (d && d.length > 0) {
    return [parseFloat(d[0].lon), parseFloat(d[0].lat)];
  }
  return null;
}

// ============================================================
// Geocodificación de origen/destino
// ============================================================

async function geocode(q) {
  const url = 'https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(q + ', España') + '&limit=1';
  const r = await fetch(url);
  const d = await r.json();
  if (!d || !d.length) throw new Error('No se encontró: ' + q);
  return [parseFloat(d[0].lon), parseFloat(d[0].lat)];
}

// ============================================================
// Routing con OSRM
// ============================================================

async function getRoute(from, to, avoidTolls) {
  let url = `https://router.project-osrm.org/route/v1/driving/${from[0]},${from[1]};${to[0]},${to[1]}?overview=full&geometries=geojson`;
  if (avoidTolls) url += '&exclude=toll';
  const r = await fetch(url);
  const d = await r.json();
  if (d.code !== 'Ok') throw new Error(d.message || 'Error calculando ruta');
  return d.routes[0];
}

// ============================================================
// Cálculo de peajes con matching espacial
// ============================================================

function calculateTolls(geometry) {
  if (!tollData?.networks || !geometry?.coordinates) {
    return { total: estimateTolls(geometry), method: 'heuristic' };
  }

  const coords = geometry.coordinates;
  let totalTolls = 0;
  let matchedSegments = 0;

  // Para cada red de peajes
  for (const network of tollData.networks) {
    // Indexar estaciones por nombre
    const stationMap = {};
    for (const s of network.stations || []) {
      if (s.name && stationCoords[s.name]) {
        stationMap[s.name] = stationCoords[s.name];
      }
    }

    // Para cada segmento, verificar si la ruta pasa por entry y exit
    for (const seg of network.segments || []) {
      const entryCoord = stationMap[seg.entry_point];
      const exitCoord = stationMap[seg.exit_point];
      if (!entryCoord || !exitCoord) continue;

      // Verificar si la ruta pasa cerca de ambas estaciones
      const nearEntry = isPointNearRoute(coords, entryCoord);
      const nearExit = isPointNearRoute(coords, exitCoord);

      if (nearEntry && nearExit) {
        const rate = seg.rates?.light || seg.rates?.heavy_1 || 0;
        totalTolls += rate;
        matchedSegments++;
      }
    }
  }

  // Si no hemos matchado nada, usar heurística
  if (matchedSegments === 0) {
    return { total: estimateTolls(geometry), method: 'heuristic' };
  }

  return { total: Math.round(totalTolls * 100) / 100, method: 'real', matchedSegments };
}

function isPointNearRoute(routeCoords, point, thresholdKm = 3.0) {
  // Buscar la distancia mínima del punto a cualquier punto de la ruta
  // Muestreo: verificar cada 5 puntos para eficiencia
  for (let i = 0; i < routeCoords.length; i += 5) {
    const rc = routeCoords[i];
    const dist = haversine(rc[0], rc[1], point[0], point[1]);
    if (dist <= thresholdKm) return true;
  }
  // Verificar también el último punto
  const last = routeCoords[routeCoords.length - 1];
  if (haversine(last[0], last[1], point[0], point[1]) <= thresholdKm) return true;
  return false;
}

function estimateTolls(geometry) {
  if (!geometry?.coordinates) return 0;
  // Estimación: cada punto de coordenada ~ 500m, tarifa media ~0.10€/km en autopistas de peaje
  const km = geometry.coordinates.length * 0.5;
  return Math.min(Math.round(km * 0.10 * 100) / 100, 60);
}

// ============================================================
// Cálculo principal de ruta
// ============================================================

async function calculateRoute() {
  const origin = document.getElementById('origin').value.trim();
  const dest = document.getElementById('destination').value.trim();
  const btn = document.getElementById('calcBtn');
  const status = document.getElementById('status');
  const sliderContainer = document.getElementById('sliderContainer');
  const routeInfo = document.getElementById('routeInfo');
  const infoBanner = document.getElementById('infoBanner');

  if (!origin || !dest) {
    status.style.display = 'block';
    status.innerHTML = '<span class="error">❌ Introduce origen y destino</span>';
    return;
  }

  btn.disabled = true;
  status.style.display = 'block';
  status.textContent = 'Geocodificando...';
  sliderContainer.classList.remove('visible');
  routeInfo.classList.remove('visible');
  infoBanner.classList.remove('visible');

  try {
    // Limpiar capas anteriores
    routeLayers.forEach(l => map.removeLayer(l));
    routeLayers = [];

    const from = await geocode(origin);
    const to = await geocode(dest);

    status.textContent = 'Calculando rutas...';

    // Obtener ruta rápida (con peajes) y sin peajes en paralelo
    const [fastRoute, tollFreeRoute] = await Promise.all([
      getRoute(from, to, false),
      getRoute(from, to, true)
    ]);

    // Calcular peajes reales
    const fastTolls = calculateTolls(fastRoute.geometry);
    const tfTolls = calculateTolls(tollFreeRoute.geometry);

    currentRoutes = {
      fastest: {
        route: fastRoute,
        tolls: fastTolls.total,
        tollMethod: fastTolls.method,
        time: fastRoute.duration,
        dist: fastRoute.distance
      },
      tollFree: {
        route: tollFreeRoute,
        tolls: tfTolls.total,
        tollMethod: tfTolls.method,
        time: tollFreeRoute.duration,
        dist: tollFreeRoute.distance
      }
    };

    const slider = document.getElementById('budgetSlider');
    const maxBudget = Math.ceil(fastTolls.total);
    slider.max = Math.max(maxBudget, 1);
    slider.value = maxBudget;
    slider.step = 0.5;
    document.getElementById('budgetValue').textContent = maxBudget.toFixed(2) + ' €';

    sliderContainer.classList.add('visible');
    routeInfo.classList.add('visible');
    infoBanner.classList.add('visible');

    updateBudget(maxBudget);

    // Ajustar mapa a la ruta
    const bounds = L.geoJSON(fastRoute.geometry).getBounds();
    map.fitBounds(bounds, { padding: [60, 60], maxZoom: 15 });

  } catch (e) {
    status.innerHTML = '<span class="error">❌ ' + (e.message || 'Error desconocido') + '</span>';
    console.error(e);
  } finally {
    btn.disabled = false;
  }
}

// ============================================================
// Actualizar UI según presupuesto
// ============================================================

function updateBudget(value) {
  const budget = parseFloat(value);
  document.getElementById('budgetValue').textContent = budget.toFixed(2) + ' €';

  const f = currentRoutes.fastest;
  const t = currentRoutes.tollFree;

  if (!f || !t) return;

  let selected;

  if (budget >= f.tolls) {
    selected = f;
  } else if (budget <= 0) {
    selected = t;
  } else {
    // Interpolar entre ruta sin peajes y ruta rápida
    const ratio = Math.min(budget / f.tolls, 1);
    selected = {
      route: f.route,
      tolls: budget,
      time: t.time + (f.time - t.time) * ratio,
      dist: t.dist + (f.dist - t.dist) * ratio
    };
  }

  // Actualizar stats
  const totalMinutes = Math.round(selected.time / 60);
  const hours = Math.floor(totalMinutes / 60);
  const mins = totalMinutes % 60;
  document.getElementById('timeValue').textContent = hours > 0 ? hours + 'h ' + mins + 'm' : mins + ' min';
  document.getElementById('priceValue').textContent = selected.tolls.toFixed(2) + ' €';
  document.getElementById('distValue').textContent = (selected.dist / 1000).toFixed(1) + ' km';

  // Color del precio según ahorro
  const priceEl = document.getElementById('priceValue');
  priceEl.className = 'value' + (selected.tolls === 0 ? ' saving' : selected.tolls < f.tolls * 0.5 ? ' warning' : '');

  // Renderizar ruta en mapa
  renderRoute(selected, f.tolls);
  updateAlternatives();
}

function renderRoute(selected, maxTolls) {
  routeLayers.forEach(l => map.removeLayer(l));
  routeLayers = [];

  const color = selected.tolls === 0 ? '#4CAF50' : selected.tolls >= maxTolls ? '#2196F3' : '#FF9800';

  const line = L.geoJSON(selected.route.geometry, {
    style: { color: color, weight: 5, opacity: 0.85, lineJoin: 'round' }
  }).addTo(map);
  routeLayers.push(line);

  const coords = selected.route.geometry.coordinates;
  if (coords && coords.length > 0) {
    const start = L.marker([coords[0][1], coords[0][0]], {
      icon: L.divIcon({
        className: 'custom-marker',
        html: '<div style="background:#4CAF50;width:14px;height:14px;border-radius:50%;border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3)"></div>',
        iconSize: [20, 20], iconAnchor: [10, 10]
      })
    }).addTo(map).bindPopup('<b>A</b> Origen');
    routeLayers.push(start);

    const end = L.marker([coords[coords.length - 1][1], coords[coords.length - 1][0]], {
      icon: L.divIcon({
        className: 'custom-marker',
        html: '<div style="background:#f44336;width:14px;height:14px;border-radius:50%;border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3)"></div>',
        iconSize: [20, 20], iconAnchor: [10, 10]
      })
    }).addTo(map).bindPopup('<b>B</b> Destino');
    routeLayers.push(end);
  }
}

function updateAlternatives() {
  const container = document.getElementById('alternatives');
  const f = currentRoutes.fastest;
  const t = currentRoutes.tollFree;
  const sliderVal = parseFloat(document.getElementById('budgetSlider').value);

  if (!f || !t) return;

  let html = '';

  // Ruta más rápida
  const fm = Math.round(f.time / 60);
  const fh = Math.floor(fm / 60);
  const fr = fm % 60;
  const isFastActive = f.tolls <= sliderVal;
  html += `<div class="alt-card fastest ${isFastActive ? 'active' : ''}" onclick="document.getElementById('budgetSlider').value=${f.tolls};updateBudget(${f.tolls})">`;
  html += `<div class="alt-time">${fh > 0 ? fh + 'h ' + fr + 'm' : fr + ' min'}</div>`;
  html += `<div class="alt-price">${f.tolls.toFixed(2)} €</div>`;
  html += `<div class="alt-label">⚡ Más rápida</div>`;
  if (f.tollMethod === 'real') html += `<div class="alt-badge">Datos reales</div>`;
  html += `</div>`;

  // Ruta sin peajes
  const tm = Math.round(t.time / 60);
  const th = Math.floor(tm / 60);
  const tr = tm % 60;
  const isFreeActive = sliderVal <= 0;
  html += `<div class="alt-card cheapest ${isFreeActive ? 'active' : ''}" onclick="document.getElementById('budgetSlider').value=0;updateBudget(0)">`;
  html += `<div class="alt-time">${th > 0 ? th + 'h ' + tr + 'm' : tr + ' min'}</div>`;
  html += `<div class="alt-price">0 €</div>`;
  html += `<div class="alt-label">🐢 Sin peajes</div>`;
  html += `</div>`;

  // Diferencia
  const diffMin = Math.round((t.time - f.time) / 60);
  const diffSign = diffMin > 0 ? '+' : '';
  html += `<div class="alt-card" style="background:#f5f5f5;cursor:default">`;
  html += `<div class="alt-time" style="color:#666">${diffSign}${diffMin} min</div>`;
  html += `<div class="alt-price" style="color:#999">${f.tolls.toFixed(2)} €</div>`;
  html += `<div class="alt-label">💡 Diferencia</div>`;
  html += `</div>`;

  container.innerHTML = html;
}

// ============================================================
// Inicialización
// ============================================================

window.onload = async () => {
  initMap();
  await loadTollData();
};

// Enter en inputs para calcular
['origin', 'destination'].forEach(id => {
  document.getElementById(id)?.addEventListener('keydown', e => {
    if (e.key === 'Enter') calculateRoute();
  });
});
</script>
