<title>TollRoute — Ruta más rápida con tu presupuesto</title>
<meta name="description" content="Calcula la ruta más rápida en coche respetando tu presupuesto máximo de peajes en España.">

  'M-413\nArroyomolinos\nMoraleja': [-3.9167, 40.2667],
  'M-413 Arroyomolinos/Moraleja': [-3.9167, 40.2667],
  'Madrid\nM-40\nM-602': [-3.5667, 40.4833],
  'Madrid / M-40 / M-602': [-3.5667, 40.4833],
  'AP-41 Mad. Toledo': [-3.8500, 40.1000],
  'AP-41 Madrid-Toledo': [-3.8500, 40.1000],
};

const CACHE_KEY = 'tollroute_station_coords';
const CACHE_TTL_DAYS = 30;

let tollData = null;
let stationCoords = {};
let currentRoutes = {};
let currentTollBreakdown = [];
let selectedRouteType = 'fastest';
let map, routeLayers = [];

// ============================================================
// Utilidades
// ============================================================

function haversine(lon1, lat1, lon2, lat2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function loadCachedCoords() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return;
    const cached = JSON.parse(raw);
    const now = Date.now();
    for (const [name, entry] of Object.entries(cached)) {
      if (now - entry.ts < CACHE_TTL_DAYS * 86400000) stationCoords[name] = entry.coord;
    }
  } catch(e) {}
}

function saveCachedCoords() {
  try {
    const payload = {};
    for (const [name, coord] of Object.entries(stationCoords)) payload[name] = { coord, ts: Date.now() };
    localStorage.setItem(CACHE_KEY, JSON.stringify(payload));
  } catch(e) {}
}

// ============================================================
// Datos
// ============================================================

async function loadTollData() {
  try {
    const r = await fetch('spain_tolls.json');
    tollData = await r.json();
    loadCachedCoords();
    for (const [name, coord] of Object.entries(PRELOADED_STATION_COORDS)) {
      if (!stationCoords[name]) stationCoords[name] = coord;
    }
    geocodeMissingStations();
  } catch(e) {
    tollData = { networks: [], metadata: {} };
  }
}

async function geocodeMissingStations() {
  const missing = new Set();
  for (const net of tollData.networks || []) {
    for (const s of net.stations || []) {
      if (s.name && !stationCoords[s.name]) missing.add(s.name);
    }
  }
  for (const name of Array.from(missing)) {
    try {
      const q = encodeURIComponent(name + ', España');
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${q}&limit=1`;
      const d = await (await fetch(url)).json();
      if (d?.length) { stationCoords[name] = [parseFloat(d[0].lon), parseFloat(d[0].lat)]; saveCachedCoords(); }
    } catch(e) {}
    await new Promise(r => setTimeout(r, 600));
  }
}

// ============================================================
// Mapa
// ============================================================

function initMap() {
  map = L.map('map', { zoomControl: false }).setView([40.4168, -3.7038], 6);
  L.control.zoom({ position: 'topright' }).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a>', maxZoom: 18
  }).addTo(map);
  window.addEventListener('resize', () => setTimeout(() => map.invalidateSize(), 100));
}

// ============================================================
// Routing
// ============================================================

async function geocodeAddr(q) {
  const url = 'https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(q + ', España') + '&limit=1';
  const d = await (await fetch(url)).json();
  if (!d?.length) throw new Error('No se encontró: ' + q);
  return [parseFloat(d[0].lon), parseFloat(d[0].lat)];
}

async function getRoute(from, to, avoidTolls) {
  let url = `https://router.project-osrm.org/route/v1/driving/${from[0]},${from[1]};${to[0]},${to[1]}?overview=full&geometries=geojson`;
  if (avoidTolls) url += '&exclude=toll';
  const d = await (await fetch(url)).json();
  if (d.code !== 'Ok') {
    if (d.message?.includes('Exclude flag combination is not supported')) return null;
    throw new Error(d.message || 'Error calculando ruta');
  }
  return d.routes[0];
}

// ============================================================
// Cálculo de peajes con desglose
// ============================================================

function calculateTolls(geometry) {
  if (!tollData?.networks || !geometry?.coordinates) {
    return { total: estimateTolls(geometry), items: [], method: 'heuristic' };
  }
  const coords = geometry.coordinates;
  let total = 0;
  const items = [];

  for (const network of tollData.networks) {
    const stationMap = {};
    for (const s of network.stations || []) {
      if (s.name && stationCoords[s.name]) stationMap[s.name] = stationCoords[s.name];
    }

    const networkItems = [];
    for (const seg of network.segments || []) {
      const entry = stationMap[seg.entry_point];
      const exit = stationMap[seg.exit_point];
      if (!entry || !exit) continue;
      if (isPointNearRoute(coords, entry) && isPointNearRoute(coords, exit)) {
        const rate = seg.rates?.light || seg.rates?.heavy_1 || 0;
        if (rate > 0) {
          total += rate;
          networkItems.push({
            road: network.road_id,
            roadName: network.road_name,
            from: seg.entry_point,
            to: seg.exit_point,
            rate: rate,
            rateLabel: rate.toFixed(2) + ' €'
          });
        }
      }
    }

    if (networkItems.length > 0) {
      const netTotal = networkItems.reduce((s, i) => s + i.rate, 0);
      items.push({
        road: network.road_id,
        roadName: network.road_name || network.road_id,
        total: netTotal,
        segments: networkItems
      });
    }
  }

  if (items.length === 0) {
    const est = estimateTolls(geometry);
    return { total: est, items: [{ road: 'Estimado', roadName: 'Peajes estimados', total: est, segments: [], estimated: true }], method: 'heuristic' };
  }

  return { total: Math.round(total * 100) / 100, items, method: 'real' };
}

function isPointNearRoute(routeCoords, point, thresholdKm = 4.0) {
  for (let i = 0; i < routeCoords.length; i += 5) {
    const rc = routeCoords[i];
    if (haversine(rc[0], rc[1], point[0], point[1]) <= thresholdKm) return true;
  }
  const last = routeCoords[routeCoords.length - 1];
  if (haversine(last[0], last[1], point[0], point[1]) <= thresholdKm) return true;
  return false;
}

function estimateTolls(geometry) {
  if (!geometry?.coordinates) return 0;
  const km = geometry.coordinates.length * 0.5;
  return Math.min(Math.round(km * 0.10 * 100) / 100, 60);
}

// ============================================================
// UI Principal
// ============================================================

async function calculateRoute() {
  const origin = document.getElementById('origin').value.trim();
  const dest = document.getElementById('destination').value.trim();
  const btn = document.getElementById('calcBtn');
  const status = document.getElementById('status');
  const routeCard = document.getElementById('routeCard');

  if (!origin || !dest) {
    status.style.display = 'block';
    status.innerHTML = '<span class="error">❌ Introduce origen y destino</span>';
    return;
  }

  btn.disabled = true;
  status.style.display = 'block';
  status.textContent = 'Geocodificando...';
  routeCard.classList.remove('visible');

  try {
    routeLayers.forEach(l => map.removeLayer(l));
    routeLayers = [];

    const from = await geocodeAddr(origin);
    const to = await geocodeAddr(dest);

    status.textContent = 'Calculando rutas...';

    const fastRoute = await getRoute(from, to, false);
    if (!fastRoute) throw new Error('No se pudo calcular la ruta');

    let tollFreeRoute = await getRoute(from, to, true);
    let tollFreeEstimated = false;
    if (!tollFreeRoute) {
      tollFreeRoute = {
        geometry: fastRoute.geometry,
        duration: fastRoute.duration * 1.25,
        distance: fastRoute.distance * 1.15,
        legs: fastRoute.legs
      };
      tollFreeEstimated = true;
    }

    const fastTolls = calculateTolls(fastRoute.geometry);
    const tfTolls = calculateTolls(tollFreeRoute.geometry);

    currentRoutes = {
      fastest: { route: fastRoute, tolls: fastTolls, time: fastRoute.duration, dist: fastRoute.distance, from, to },
      tollFree: { route: tollFreeRoute, tolls: tfTolls, time: tollFreeRoute.duration, dist: tollFreeRoute.distance, estimated: tollFreeEstimated, from, to }
    };
    currentTollBreakdown = fastTolls.items;
    selectedRouteType = 'fastest';

    // Setup budget slider
    const slider = document.getElementById('budgetSlider');
    slider.max = Math.ceil(fastTolls.total);
    slider.value = Math.ceil(fastTolls.total);
    document.getElementById('budgetValue').textContent = Math.ceil(fastTolls.total).toFixed(2) + ' €';
    document.getElementById('budgetFilter').style.display = 'flex';

    renderRouteSelector();
    renderRoute();
    renderTollBreakdown();
    updateMapsBtn();

    routeCard.classList.add('visible');
    const bounds = L.geoJSON(fastRoute.geometry).getBounds();
    map.fitBounds(bounds, { padding: [60, 60], maxZoom: 15 });

  } catch (e) {
    status.innerHTML = '<span class="error">❌ ' + (e.message || 'Error desconocido') + '</span>';
    console.error(e);
  } finally {
    btn.disabled = false;
  }
}

function renderRouteSelector() {
  const f = currentRoutes.fastest;
  const t = currentRoutes.tollFree;
  const fm = Math.round(f.time / 60), fh = Math.floor(fm / 60), fr = fm % 60;
  const tm = Math.round(t.time / 60), th = Math.floor(tm / 60), tr = tm % 60;

  let html = '';
  html += `<button class="route-tab ${selectedRouteType === 'fastest' ? 'active' : ''}" onclick="selectRouteType('fastest')">`;
  html += `⚡ Más rápida<div class="tab-price">${f.tolls.total.toFixed(2)} € · ${fh}h ${fr}m</div></button>`;
  html += `<button class="route-tab ${selectedRouteType === 'tollFree' ? 'active' : ''}" onclick="selectRouteType('tollFree')">`;
  html += `🐢 Sin peajes${t.estimated ? '<span class="badge estimated">estimado</span>' : ''}<div class="tab-price">0 € · ${th}h ${tr}m</div></button>`;
  document.getElementById('routeSelector').innerHTML = html;
}

function selectRouteType(type) {
  selectedRouteType = type;
  renderRouteSelector();
  renderRoute();
  renderTollBreakdown();
  updateMapsBtn();
}

function renderRoute() {
  routeLayers.forEach(l => map.removeLayer(l));
  routeLayers = [];

  const r = currentRoutes[selectedRouteType];
  const color = selectedRouteType === 'tollFree' ? '#4CAF50' : '#2196F3';

  const line = L.geoJSON(r.route.geometry, {
    style: { color: color, weight: 5, opacity: 0.85, lineJoin: 'round' }
  }).addTo(map);
  routeLayers.push(line);

  const coords = r.route.geometry.coordinates;
  if (coords?.length > 0) {
    routeLayers.push(L.marker([coords[0][1], coords[0][0]], {
      icon: L.divIcon({ className: '', html: '<div style="background:#4CAF50;width:14px;height:14px;border-radius:50%;border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3)"></div>', iconSize: [20,20], iconAnchor: [10,10] })
    }).addTo(map).bindPopup('<b>A</b> Origen'));
    routeLayers.push(L.marker([coords[coords.length-1][1], coords[coords.length-1][0]], {
      icon: L.divIcon({ className: '', html: '<div style="background:#f44336;width:14px;height:14px;border-radius:50%;border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3)"></div>', iconSize: [20,20], iconAnchor: [10,10] })
    }).addTo(map).bindPopup('<b>B</b> Destino'));
  }

  // Render stats
  const m = Math.round(r.time / 60), h = Math.floor(m / 60), rm = m % 60;
  document.getElementById('mainStats').innerHTML = `
    <div class="stat"><div class="value">${h > 0 ? h + 'h ' + rm + 'm' : rm + ' min'}</div><div class="label">Tiempo</div></div>
    <div class="stat"><div class="value">${selectedRouteType === 'tollFree' ? '0 €' : r.tolls.total.toFixed(2) + ' €'}</div><div class="label">Peajes</div></div>
    <div class="stat"><div class="value">${(r.dist / 1000).toFixed(1)} km</div><div class="label">Distancia</div></div>
  `;
}

function renderTollBreakdown() {
  const container = document.getElementById('tollBreakdown');
  const budget = parseFloat(document.getElementById('budgetSlider').value);

  if (selectedRouteType === 'tollFree') {
    container.innerHTML = '<div class="no-tolls">🎉 No hay peajes en esta ruta</div>';
    return;
  }

  let html = '<h4>Desglose de peajes</h4>';
  let filteredTotal = 0;

  for (const item of currentTollBreakdown) {
    const included = item.total <= budget || item.estimated;
    if (included) filteredTotal += item.total;

    html += `<div class="toll-item">`;
    html += `<input type="checkbox" class="toll-checkbox" ${included ? 'checked' : ''} onchange="toggleToll('${item.road}', this.checked)" title="Incluir/excluir">`;
    html += `<div class="toll-info">`;
    html += `<div class="toll-road">${item.roadName} ${item.estimated ? '<span class="badge estimated">estimado</span>' : '<span class="badge">datos reales</span>'}</div>`;
    if (item.segments.length > 0) {
      html += `<div class="toll-detail">${item.segments.length} tramo${item.segments.length > 1 ? 's' : ''}: ${item.segments.map(s => s.from + ' → ' + s.to).join(', ')}</div>`;
    }
    html += `</div>`;
    html += `<div class="toll-price ${!included ? 'strikethrough' : ''}">${item.total.toFixed(2)} €</div>`;
    html += `</div>`;
  }

  html += `<div class="toll-total"><span>Total incluido</span><span>${filteredTotal.toFixed(2)} €</span></div>`;
  html += `<div class="hint-text">💡 Desmarca peajes para ver cuánto ahorras. La ruta en el mapa muestra la opción más rápida o sin peajes.</div>`;
  container.innerHTML = html;
}

function toggleToll(road, checked) {
  // Update budget slider to reflect this toggle
  let includedTotal = 0;
  for (const item of currentTollBreakdown) {
    if (item.road === road) {
      if (checked) includedTotal += item.total;
    } else {
      // Check if it was already included by budget
      const budget = parseFloat(document.getElementById('budgetSlider').value);
      if (item.total <= budget || item.estimated) includedTotal += item.total;
    }
  }
  // Re-render
  renderTollBreakdown();
}

function updateBudgetFilter(val) {
  document.getElementById('budgetValue').textContent = parseFloat(val).toFixed(2) + ' €';
  renderTollBreakdown();
}

function updateMapsBtn() {
  const r = currentRoutes[selectedRouteType];
  if (!r) return;
  const [lon1, lat1] = r.from;
  const [lon2, lat2] = r.to;
  const url = `https://www.google.com/maps/dir/?api=1&origin=${lat1},${lon1}&destination=${lat2},${lon2}&travelmode=driving`;
  const btn = document.getElementById('mapsBtn');
  btn.href = url;
  btn.style.display = 'block';
}

// ============================================================
// Init
// ============================================================

window.onload = async () => {
  initMap();
  await loadTollData();
};

['origin', 'destination'].forEach(id => {
  document.getElementById(id)?.addEventListener('keydown', e => { if (e.key === 'Enter') calculateRoute(); });
});
</script>
</body>
</html>
